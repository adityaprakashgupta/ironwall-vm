[workspace]
resolver = "2"
members = [
    "crates/bayora-common",
    "crates/bayora-referee",
    "crates/bayora-signer",
    "crates/bayora-verifier",
]
# `cargo fuzz` needs a nightly toolchain and its own lockfile; keep it out of
# the stable workspace build.
exclude = ["fuzz"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
bayora-common = { path = "crates/bayora-common" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "3", features = ["fast", "zeroize"] }
hex = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
lto = "thin"
