[package]
name = "bayora-llm-engine"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Bayora Enclave LLM inference engine backed by llama-cpp-4. Ships a single static binary plus one GGUF model — no host Python, no system-library drift."

[dependencies]
# dynamic-link is disabled so llama.cpp is statically linked into the binary.
# default-features = false avoids pulling in any optional shared-library features.
llama-cpp-4 = { version = "0.9", default-features = false }
bayora-common = { path = "../bayora-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"

[[bin]]
name = "bayora-llm-agent"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
